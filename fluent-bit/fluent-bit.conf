[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /etc/fluent-bit/parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log
    Parser            nginx
    Tag               nginx.access
    Read_from_Head    On

[INPUT]
    Name              tail
    Path              /var/log/nginx/error.log
    Tag               nginx.error
    Read_from_Head    On

[OUTPUT]
    Name              opensearch
    Match             nginx.*
    Host              127.0.0.1
    Port              9200
    HTTP_User         admin
    HTTP_Passwd       ${OPENSEARCH_PASSWORD}
    TLS               On
    TLS.Verify        Off
    Index             nginx-logs
    Suppress_Type_Name On
